name: ArchitectOS PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Bring your own key: this review is opt-in. It runs only if the repo (or fork)
    # has set its own ANTHROPIC_API_KEY secret. With no key set, every step is skipped
    # and the job passes — it never uses or bills the upstream maintainer's account.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for an API key (skip review if absent)
        id: guard
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret set for this repository — skipping AI review."
            echo "This workflow is bring-your-own-key. Add your own ANTHROPIC_API_KEY in"
            echo "Settings → Secrets and variables → Actions to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/cli/package-lock.json

      - name: Install review dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci
        working-directory: tools/cli

      - name: Run ArchitectOS Review
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/cli/pr-review.js
